services:
  codex-connector:
    image: local/pi-codex-connector:48f12a8f2
    build: .
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../config/volumes/pi-connectors/codex:/data
      - ../config/env/pi-connectors/codex.key:/run/secrets/client.key:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy

networks:
  proxy:
    external: true
