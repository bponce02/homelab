version: 1.3.17
cache: true
interface:
  schedules:
    use: true
    create: true
endpoints:
  agents:
    allowedProviders:
      - OpenRouter
      - Ollama
      - Codex Subscription
    capabilities:
      - tools
      - memory
  custom:
    - name: Codex Subscription
      apiKey: ${CODEX_CONNECTOR_API_KEY}
      baseURL: http://codex-connector:8788/v1
      models:
        default:
          - gpt-6.1-sol
          - gpt-6-astra
          - gpt-6-luna
        fetch: false
      titleConvo: false
      modelDisplayLabel: Codex Subscription
      dropParams:
        - temperature
        - top_p
        - presence_penalty
        - frequency_penalty
        - max_tokens
        - max_completion_tokens
    - name: Ollama
      apiKey: ollama
      baseURL: http://ollama:11434/v1/
      models:
        default:
          - gemma3:1b
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: Ollama
    - name: OpenRouter
      apiKey: ${OPENROUTER_API_KEY}
      baseURL: https://openrouter.ai/api/v1
      models:
        default:
          - openai/gpt-4.1-mini
        fetch: true
      titleConvo: true
      titleModel: current_model
      modelDisplayLabel: OpenRouter

mcpSettings:
  allowedAddresses:
    - open-terminal:8000
    - camofox-mcp:8080
    - stirling-pdf-mcp:8000
mcpServers:
  stirling-pdf:
    type: streamable-http
    requiresOAuth: false
    url: http://stirling-pdf-mcp:8000/mcp
    headers:
      Authorization: Bearer ${STIRLING_MCP_API_KEY}
    timeout: 240000
    initTimeout: 30000
  camofox:
    type: streamable-http
    requiresOAuth: false
    url: http://camofox-mcp:8080/mcp
    headers:
      Authorization: Bearer ${CAMOFOX_HTTP_API_KEY}
    timeout: 120000
    initTimeout: 30000
  open-terminal:
    type: streamable-http
    requiresOAuth: false
    url: http://open-terminal:8000/mcp
    headers:
      Authorization: Bearer ${OPEN_TERMINAL_API_KEY}
    timeout: 120000
    initTimeout: 30000

memory:
  disabled: false
  personalize: true
  tokenLimit: 2000
  maxInputTokens: 6000
  agent:
    enabled: true
    provider: OpenRouter
    model: openai/gpt-4.1-mini
