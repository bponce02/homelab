# Reference endpoints: both entries are configured; do not duplicate them.
# Both use server-configured keys for this single-user instance; keep registration disabled.
# Local Pi sessions become available only after loading the bridge in Pi.
endpoints:
  custom:
    - name: Codex Subscription
      apiKey: ${CODEX_CONNECTOR_API_KEY}
      baseURL: http://codex-connector:8788/v1
      models:
        default:
          - gpt-6.1-sol
          - gpt-6-astra
          - gpt-6-luna
        fetch: false
      titleConvo: false
      modelDisplayLabel: Codex Subscription
      dropParams:
        - temperature
        - top_p
        - presence_penalty
        - frequency_penalty
        - max_tokens
        - max_completion_tokens
    - name: Local Pi
      apiKey: ${LOCAL_PI_API_KEY}
      baseURL: ${LOCAL_PI_BASE_URL}
      models:
        default:
          - pi/homelab
        fetch: true
      titleConvo: false
      modelDisplayLabel: Local Pi
      dropParams:
        - temperature
        - top_p
        - presence_penalty
        - frequency_penalty
        - max_tokens
        - max_completion_tokens
# "Codex Subscription" is already included in endpoints.agents.allowedProviders.
# Do NOT add "Local Pi": Pi, rather than LibreChat, runs that session's tools.
