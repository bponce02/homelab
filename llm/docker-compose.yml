services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_GPU=0             # set 0 for CPU-only, omit if you have a GPU
      - OLLAMA_NUM_THREADS=${THREADS:-2}
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - proxy

  camofox:
    image: ghcr.io/redf0x1/camofox-browser:2.4.7
    container_name: camofox
    restart: unless-stopped
    init: true
    env_file:
      - ../config/env/llm/camofox.env
    environment:
      CAMOFOX_HOST: 0.0.0.0
      CAMOFOX_AUTH_MODE: required
      CAMOFOX_ALLOW_PRIVATE_NETWORK: "false"
      CAMOFOX_CRASH_REPORT_ENABLED: "false"
    shm_size: 1g
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9377/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - browser

  camofox-mcp:
    image: ghcr.io/redf0x1/camofox-mcp:1.15.0
    container_name: camofox-mcp
    restart: unless-stopped
    init: true
    command: ["node", "dist/http.js"]
    env_file:
      - ../config/env/llm/camofox.env
    environment:
      CAMOFOX_URL: http://camofox:9377
      CAMOFOX_TRANSPORT: http
      CAMOFOX_HTTP_HOST: 0.0.0.0
      CAMOFOX_HTTP_PORT: 8080
      CAMOFOX_HTTP_ALLOWED_HOSTS: camofox-mcp,localhost,127.0.0.1
      CAMOFOX_AUTO_SAVE: "false"
    depends_on:
      camofox:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - browser

  open-terminal:
    build: ./open-terminal
    image: local/open-terminal:0.14.0-mcp-4.0.11
    container_name: open-terminal
    restart: unless-stopped
    env_file:
      - ../config/env/llm/open-terminal.env
    volumes:
      - terminal-home:/home/user
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; assert httpx.get('http://127.0.0.1:8000/mcp').status_code == 401"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - terminal
    cpus: 2
    mem_limit: 2g
    pids_limit: 256

volumes:
  terminal-home:

networks:
  proxy:
    external: true
  terminal:
  browser:
