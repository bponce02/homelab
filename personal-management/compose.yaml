# Personal Management on Dokploy. Built from the private repository's main branch:
# click Deploy in Dokploy to build and run the latest commit.
# Values in ${...} come from the service's Environment tab in Dokploy.
services:
  web:
    build:
      context: https://github.com/bponce02/personal-management.git#main
      secrets:
        - GIT_AUTH_TOKEN
    image: personal-management:main
    restart: unless-stopped
    environment: &app-env
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ALLOWED_HOSTS: per.develium.dev
      CSRF_TRUSTED_ORIGINS: https://per.develium.dev
      TIME_ZONE: America/New_York
      DEBUG: "False"
      DJANGO_VITE_DEV_MODE: "False"
      DB_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/data/media
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_CLAIMS_EMAIL: ${VAPID_CLAIMS_EMAIL}
      PUSH_NOTIFY_TOKEN: ${PUSH_NOTIFY_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dokploy-network

  # Background worker for the workspace agent (same image, separate process).
  # The app shows the agent as offline unless this is running.
  agent:
    image: personal-management:main
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "run_agent"]
    environment: *app-env
    volumes:
      - app-data:/app/data
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 90s
    networks:
      - dokploy-network

secrets:
  # GitHub token with read access to the private repository; BuildKit uses this
  # secret id to authenticate the Git build context.
  GIT_AUTH_TOKEN:
    environment: GIT_AUTH_TOKEN

volumes:
  app-data:

networks:
  dokploy-network:
    external: true
