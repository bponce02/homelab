config-version: 8
server:
  host: 0.0.0.0
  port: 8317
  trusted-proxies: []
  discovery:
    enabled: false
management:
  allow-remote: true
  secret-key: REPLACE_MANAGEMENT_KEY
  disable-control-panel: false
  disable-auto-update-panel: true
access:
  api-keys:
    - REPLACE_CLIENT_KEY
oauth:
  auth-dir: /data/auth
routing:
  strategy: fill-first
observability:
  logs:
    debug: false
    logging-to-file: false
    request-log: false
    logs-max-total-size-mb: 50
    error-logs-max-files: 3
  usage:
    usage-statistics-enabled: true
