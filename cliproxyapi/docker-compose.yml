services:
  cliproxyapi:
    image: eceasy/cli-proxy-api:v8.0.16@sha256:71c86af15412f16e5bca222dd656faaa0f01c9946cffa281e8ace85ed3f5f7b9
    container_name: cliproxyapi
    restart: unless-stopped
    user: "1000:1000"
    command: ["./CLIProxyAPI", "-config", "/etc/cliproxyapi/config.yaml"]
    environment:
      HOME: /data
      TZ: UTC
      MANAGEMENT_STATIC_PATH: /data/static
    volumes:
      - ../config/env/cliproxyapi:/etc/cliproxyapi
      - ../config/volumes/cliproxyapi/auth:/data/auth
      - ../config/volumes/cliproxyapi/static:/data/static:ro
      - ../config/volumes/cliproxyapi/logs:/CLIProxyAPI/logs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    cpus: 1
    mem_limit: 1g
    pids_limit: 128
    networks:
      - proxy

networks:
  proxy:
    external: true
