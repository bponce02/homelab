services:
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest@sha256:950c596db26e0764f642def2fd4f9ee904ff2ac16d83fe621ff731b771d9b385
    container_name: stirling-pdf
    volumes:
      - ../config/volumes/stirlingpdf/trainingData:/usr/share/tessdata # Required for extra OCR languages
      - ../config/volumes/stirlingpdf/extraConfigs:/configs
      - ../config/volumes/stirlingpdf/customFiles:/customFiles/
      - ../config/volumes/stirlingpdf/logs:/logs/
      - ../config/volumes/stirlingpdf/pipeline:/pipeline/
    environment:
      - DISABLE_ADDITIONAL_FEATURES=false
      - LANGS=en_GB
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
